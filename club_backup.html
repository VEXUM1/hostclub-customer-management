<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顧客管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(218, 165, 32, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(192, 192, 192, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #daa520;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.5),
                         0 0 40px rgba(218, 165, 32, 0.3);
            font-weight: 300;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #daa520 0%, #ffd700 50%, #daa520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #c0c0c0;
            font-size: 0.75em;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        /* タブナビゲーション */
        .tab-navigation {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: rgba(26, 26, 46, 0.5);
            padding: 5px;
            border-radius: 15px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-button {
            flex: 1;
            padding: 12px 10px;
            background: rgba(40, 40, 60, 0.6);
            color: #c0c0c0;
            border: 2px solid rgba(218, 165, 32, 0.2);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
            text-align: center;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border-color: #daa520;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.4);
        }

        .tab-button:hover:not(.active) {
            background: rgba(218, 165, 32, 0.2);
            border-color: rgba(218, 165, 32, 0.4);
        }

        /* タブコンテンツ */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .main-content {
            display: block;
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(20, 20, 35, 0.95) 100%);
            border-radius: 15px;
            padding: 15px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 1px rgba(218, 165, 32, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(218, 165, 32, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card h2 {
            color: #daa520;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid rgba(218, 165, 32, 0.3);
            padding-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .api-setup {
            background: rgba(218, 165, 32, 0.1);
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-setup label {
            display: block;
            color: #daa520;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .api-setup input {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
        }

        .api-setup small {
            display: block;
            color: #c0c0c0;
            margin-top: 5px;
            font-size: 0.85em;
        }

        .api-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .api-status.connected {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .api-status.disconnected {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-with-voice {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-with-voice textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .input-with-voice textarea:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.2);
        }

        .input-with-voice textarea::placeholder {
            color: rgba(192, 192, 192, 0.5);
        }

        .voice-btn {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            width: 60px;
            height: 60px;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
            position: relative;
        }

        .voice-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
        }

        .voice-btn.listening {
            background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
            animation: pulse 1s infinite;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .btn {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border: none;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
            letter-spacing: 0.05em;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .help-text {
            font-size: 0.9em;
            color: #c0c0c0;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #daa520;
        }

        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75em;
            margin-left: 8px;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .customer-card {
            background: linear-gradient(135deg, rgba(40, 40, 60, 0.6) 0%, rgba(30, 30, 50, 0.6) 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #daa520;
            transition: all 0.4s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .customer-card.ai-analyzed {
            border-left-color: #667eea;
        }

        .customer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(218, 165, 32, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .customer-card:hover {
            transform: translateX(8px);
            box-shadow: 0 10px 40px rgba(218, 165, 32, 0.2);
            border-left-color: #ffd700;
        }

        .customer-card:hover::before {
            opacity: 1;
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .customer-name {
            font-size: 1.5em;
            font-weight: 300;
            color: #daa520;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .customer-id {
            font-size: 0.85em;
            color: #c0c0c0;
            margin-left: 10px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }

        .info-item {
            font-size: 0.95em;
            color: #e0e0e0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(218, 165, 32, 0.2);
            transition: all 0.3s;
        }

        .info-item:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(218, 165, 32, 0.4);
        }

        .info-label {
            font-weight: bold;
            color: #daa520;
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            letter-spacing: 0.05em;
        }

        .info-value {
            color: #f0f0f0;
        }

        .ai-insights {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .ai-insights-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-insights-content {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 0.9em;
        }

        .delete-btn {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
            font-weight: bold;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #a93226 0%, #c0392b 100%);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.5);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            color: #c0c0c0;
            padding: 50px;
            font-size: 1.1em;
            letter-spacing: 0.05em;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.2);
        }

        .search-box input::placeholder {
            color: rgba(192, 192, 192, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98) 0%, rgba(20, 20, 35, 0.98) 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(218, 165, 32, 0.3);
        }

        .modal-content h3 {
            color: #daa520;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .modal-content p {
            color: #c0c0c0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            letter-spacing: 0.05em;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
        }

        .modal-btn.primary:hover {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
            transform: translateY(-2px);
        }

        .modal-btn.secondary {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .modal-btn.secondary:hover {
            background: linear-gradient(135deg, #a93226 0%, #c0392b 100%);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.5);
            transform: translateY(-2px);
        }

        .modal-btn.cancel {
            background: linear-gradient(135deg, #4a4a4a 0%, #2c2c2c 100%);
            color: #c0c0c0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-btn.cancel:hover {
            background: linear-gradient(135deg, #5a5a5a 0%, #3c3c3c 100%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .edit-btn {
            background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.3);
            font-weight: bold;
            margin-right: 10px;
        }

        .edit-btn:hover {
            background: linear-gradient(135deg, #2471a3 0%, #2980b9 100%);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.5);
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        #editModal .modal-content {
            max-width: 800px;
        }

        .edit-form {
            margin-top: 20px;
        }

        .edit-form-group {
            margin-bottom: 15px;
        }

        .edit-form-group label {
            display: block;
            color: #daa520;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .edit-form-group input,
        .edit-form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }

        .edit-form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .edit-form-group input:focus,
        .edit-form-group textarea:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
        }

        /* スマートフォン対応の追加スタイル */
        .customer-card {
            padding: 15px;
            margin-bottom: 15px;
        }

        .customer-name {
            font-size: 1.2em;
        }

        .customer-info {
            grid-template-columns: 1fr;
        }

        .help-text {
            font-size: 0.85em;
            padding: 10px;
        }

        .input-with-voice textarea {
            min-height: 100px;
            font-size: 16px;
        }

        .voice-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }

        .btn {
            font-size: 14px;
            padding: 12px 20px;
        }

        .ai-badge {
            font-size: 0.7em;
            padding: 2px 6px;
        }

        @media (max-width: 1024px) {
            .main-content {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 顧客管理システム</h1>
            <p>AI搭載・自動解析対応 <span class="ai-badge">🤖 AI Powered</span></p>
        </div>

        <!-- タブナビゲーション -->
        <div class="tab-navigation">
            <button class="tab-button active" onclick="switchTab('api-key')">🔑 APIキー</button>
            <button class="tab-button" onclick="switchTab('input')">📝 情報入力</button>
            <button class="tab-button" onclick="switchTab('customer-list')">📋 顧客管理</button>
        </div>

        <div class="main-content">
            <!-- タブ1: APIキー設定 -->
            <div id="tab-api-key" class="tab-content active">
                <div class="card">
                    <h2>🔑 OpenAI APIキー設定</h2>
                    <div class="api-setup">
                        <label>🔑 OpenAI APIキー</label>
                        <input type="password" id="apiKey" placeholder="sk-...">
                        <small>APIキーは安全に保存され、外部に送信されません</small>
                        <div class="api-status disconnected" id="apiStatus">未接続</div>
                    </div>
                </div>
            </div>

            <!-- タブ2: 顧客情報入力 -->
            <div id="tab-input" class="tab-content">
                <div class="card">
                    <h2>📝 顧客情報入力</h2>
                    <div class="help-text">
                        💡 自由に情報を入力してください。AIが自動で詳細に解析します。<br>
                        例：「田中花子さん、28歳、看護師、シャンパンが好き、旅行が趣味」
                    </div>
                    <div class="input-section">
                        <div class="input-with-voice">
                            <textarea id="inputText" placeholder="お客様の情報を入力してください...&#10;&#10;AIが自動で項目を認識し、接客に役立つインサイトを提供します。&#10;🎤ボタンで音声入力も可能です。"></textarea>
                            <button class="voice-btn" onclick="startVoice()">🎤</button>
                        </div>
                        <button class="btn" id="submitBtn" onclick="processInput()">🤖 AIで解析して登録</button>
                    </div>
                </div>
            </div>

            <!-- タブ3: 顧客管理 -->
            <div id="tab-customer-list" class="tab-content">
                <div class="card">
                    <h2>📋 顧客リスト</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 お客様を検索..." oninput="displayCustomers()">
                    </div>
                    <div id="customerList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="duplicateModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #667eea; margin-bottom: 15px;">⚠️ 同名のお客様が存在します</h3>
            <p style="margin-bottom: 20px;">どのように処理しますか？</p>
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="handleDuplicate('new')">別人として新規登録</button>
                <button class="modal-btn secondary" onclick="handleDuplicate('update')">既存情報を更新</button>
                <button class="modal-btn cancel" onclick="closeDuplicateModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #daa520; margin-bottom: 15px;">✏️ 顧客情報の編集</h3>
            <div class="edit-form" id="editForm"></div>
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="saveEdit()">保存</button>
                <button class="modal-btn cancel" onclick="closeEditModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <script>
        let customers = [];
        let recognition = null;
        let pendingCustomer = null;
        let duplicateCustomerId = null;
        let openaiApiKey = null;
        let editingCustomerId = null;

        // タブ切り替え
        function switchTab(tabName) {
            // すべてのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // すべてのタブボタンを非アクティブ化
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // 選択されたタブを表示
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // 選択されたタブボタンをアクティブ化
            event.target.classList.add('active');
        }

        // APIキーの監視
        document.getElementById('apiKey').addEventListener('input', (e) => {
            openaiApiKey = e.target.value.trim();
            updateApiStatus();
        });

        function updateApiStatus() {
            const status = document.getElementById('apiStatus');
            if (openaiApiKey && openaiApiKey.startsWith('sk-')) {
                status.textContent = '接続準備完了';
                status.className = 'api-status connected';
            } else {
                status.textContent = '未接続';
                status.className = 'api-status disconnected';
            }
        }

        // 音声認識の初期化
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = false;
            recognition.interimResults = false;
        }

        // 音声入力開始
        function startVoice() {
            if (!recognition) {
                alert('お使いのブラウザは音声認識に対応していません。Chrome、Edge、Safariをご利用ください。');
                return;
            }

            const input = document.getElementById('inputText');
            const btn = event.target;
            
            btn.classList.add('listening');
            
            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                input.value += (input.value ? '\n' : '') + transcript;
                btn.classList.remove('listening');
            };

            recognition.onerror = () => {
                btn.classList.remove('listening');
                alert('音声認識エラーが発生しました。もう一度お試しください。');
            };

            recognition.onend = () => {
                btn.classList.remove('listening');
            };

            recognition.start();
        }

        // OpenAI APIでAI解析
        async function analyzeWithAI(text) {
            if (!openaiApiKey || !openaiApiKey.startsWith('sk-')) {
                throw new Error('有効なOpenAI APIキーを入力してください');
            }

            const prompt = `あなたはホストクラブの顧客管理システムのAIアシスタントです。以下の顧客情報を解析し、JSON形式で構造化してください。

顧客情報:
${text}

以下のJSON形式で返してください（該当しない項目は省略）:
{
  "name": "顧客の名前（必須）",
  "data": {
    "年齢": "年齢",
    "電話番号": "電話番号",
    "職業": "職業",
    "好きなお酒": "好きなお酒",
    "趣味": "趣味",
    "出身": "出身地",
    "好み": "その他の好みや嗜好",
    "性格": "性格の特徴",
    "予算感": "推定予算感",
    "来店頻度": "来店頻度の予測"
  },
  "aiInsights": "この顧客への接客アドバイス、おすすめのアプローチ方法、注意点など（200文字程度）"
}

名前が明確でない場合は、推測して設定してください。`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${openaiApiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                        {
                            role: 'system',
                            content: 'あなたはホストクラブの顧客管理を支援するAIです。顧客情報を構造化し、接客に役立つインサイトを提供します。'
                        },
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.7,
                    response_format: { type: "json_object" }
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API呼び出しに失敗しました');
            }

            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);
            
            return {
                name: result.name,
                data: {
                    ...result.data,
                    '入力情報': text
                },
                aiInsights: result.aiInsights
            };
        }

        // 入力処理
        async function processInput() {
            const text = document.getElementById('inputText').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!text) {
                alert('情報を入力してください。');
                return;
            }

            if (!openaiApiKey || !openaiApiKey.startsWith('sk-')) {
                alert('OpenAI APIキーを入力してください。\n\nAPIキーは https://platform.openai.com/api-keys から取得できます。');
                return;
            }

            // ローディング状態
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'AI解析中...';

            try {
                const info = await analyzeWithAI(text);
                
                if (!info.name) {
                    alert('お客様のお名前が認識できませんでした。');
                    return;
                }

                // 同名チェック
                const existingCustomer = customers.find(c => c.name === info.name);
                
                if (existingCustomer) {
                    pendingCustomer = info;
                    duplicateCustomerId = existingCustomer.id;
                    document.getElementById('duplicateModal').classList.add('active');
                } else {
                    saveCustomer(info);
                }
            } catch (error) {
                alert('AI解析エラー: ' + error.message + '\n\nAPIキーが正しいか確認してください。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '🤖 AIで解析して登録';
            }
        }

        // 重複処理
        function handleDuplicate(action) {
            if (action === 'new') {
                const count = customers.filter(c => c.name === pendingCustomer.name).length;
                saveCustomer(pendingCustomer, count + 1);
            } else if (action === 'update') {
                const customer = customers.find(c => c.id === duplicateCustomerId);
                Object.assign(customer.data, pendingCustomer.data);
                if (pendingCustomer.aiInsights) {
                    customer.aiInsights = pendingCustomer.aiInsights;
                }
                customer.updatedAt = new Date().toLocaleString('ja-JP');
                displayCustomers();
                alert('✅ お客様情報を更新しました！');
            }
            
            closeDuplicateModal();
        }

        function closeDuplicateModal() {
            document.getElementById('duplicateModal').classList.remove('active');
            pendingCustomer = null;
            duplicateCustomerId = null;
        }

        // 顧客保存
        function saveCustomer(info, idNumber = null) {
            const customer = {
                id: Date.now(),
                name: info.name,
                idNumber: idNumber,
                data: info.data,
                aiInsights: info.aiInsights || null,
                registeredAt: new Date().toLocaleString('ja-JP'),
                updatedAt: null
            };

            customers.push(customer);
            displayCustomers();
            document.getElementById('inputText').value = '';
            alert('✅ お客様情報を登録しました！');
        }

        // 顧客リスト表示
        function displayCustomers() {
            const list = document.getElementById('customerList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = customers.filter(c => {
                const searchText = c.name.toLowerCase() + ' ' + 
                                  Object.values(c.data).join(' ').toLowerCase();
                return searchText.includes(searchTerm);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">登録されているお客様がいません</div>';
                return;
            }

            list.innerHTML = filtered.map(customer => {
                const displayName = customer.idNumber 
                    ? `${customer.name} <span class="customer-id">#${customer.idNumber}</span>`
                    : customer.name;

                const dataItems = Object.entries(customer.data)
                    .filter(([key, value]) => key !== '入力情報')
                    .map(([key, value]) => `
                        <div class="info-item">
                            <span class="info-label">${key}</span>
                            <span class="info-value">${value}</span>
                        </div>
                    `).join('');

                const originalInfo = customer.data['入力情報'] ? `
                    <div class="info-item" style="grid-column: 1 / -1;">
                        <span class="info-label">入力情報</span>
                        <span class="info-value">${customer.data['入力情報']}</span>
                    </div>
                ` : '';

                const aiInsightsHtml = customer.aiInsights ? `
                    <div class="ai-insights">
                        <div class="ai-insights-title">
                            <span>🤖</span>
                            <span>AIインサイト</span>
                            <span class="ai-badge">AI分析</span>
                        </div>
                        <div class="ai-insights-content">${customer.aiInsights}</div>
                    </div>
                ` : '';

                const cardClass = customer.aiInsights ? 'customer-card ai-analyzed' : 'customer-card';

                return `
                    <div class="${cardClass}">
                        <div class="customer-header">
                            <div class="customer-name">
                                ${displayName}
                                ${customer.aiInsights ? '<span class="ai-badge">AI</span>' : ''}
                            </div>
                            <div class="button-group">
                                <button class="edit-btn" onclick="editCustomer(${customer.id})">編集</button>
                                <button class="delete-btn" onclick="deleteCustomer(${customer.id})">削除</button>
                            </div>
                        </div>
                        <div class="customer-info">
                            ${dataItems}
                            ${originalInfo}
                        </div>
                        ${aiInsightsHtml}
                        <div class="info-item" style="font-size: 0.8em; color: #999; margin-top: 10px;">
                            登録: ${customer.registeredAt}
                            ${customer.updatedAt ? `<br>更新: ${customer.updatedAt}` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 顧客削除
        function deleteCustomer(id) {
            const customer = customers.find(c => c.id === id);
            if (customer && confirm(`本当に「${customer.name}」さんの情報を削除しますか？`)) {
                customers = customers.filter(c => c.id !== id);
                displayCustomers();
                alert('削除しました');
            }
        }

        // 顧客編集
        function editCustomer(id) {
            editingCustomerId = id;
            const customer = customers.find(c => c.id === id);
            if (!customer) return;

            const formHtml = `
                <div class="edit-form-group">
                    <label>名前</label>
                    <input type="text" id="editName" value="${customer.name}">
                </div>
                ${Object.entries(customer.data)
                    .filter(([key]) => key !== '入力情報')
                    .map(([key, value]) => `
                        <div class="edit-form-group">
                            <label>${key}</label>
                            <input type="text" id="edit_${key}" value="${value || ''}">
                        </div>
                    `).join('')}
                <div class="edit-form-group">
                    <label>入力情報</label>
                    <textarea id="editOriginal">${customer.data['入力情報'] || ''}</textarea>
                </div>
                ${customer.aiInsights ? `
                    <div class="edit-form-group">
                        <label>AIインサイト</label>
                        <textarea id="editInsights">${customer.aiInsights}</textarea>
                    </div>
                ` : ''}
            `;

            document.getElementById('editForm').innerHTML = formHtml;
            document.getElementById('editModal').classList.add('active');
        }

        function saveEdit() {
            const customer = customers.find(c => c.id === editingCustomerId);
            if (!customer) return;

            // 名前の更新
            customer.name = document.getElementById('editName').value.trim();

            // データの更新
            Object.keys(customer.data).forEach(key => {
                if (key === '入力情報') {
                    customer.data[key] = document.getElementById('editOriginal').value.trim();
                } else {
                    const input = document.getElementById(`edit_${key}`);
                    if (input) {
                        customer.data[key] = input.value.trim();
                    }
                }
            });

            // AIインサイトの更新
            const insightsInput = document.getElementById('editInsights');
            if (insightsInput) {
                customer.aiInsights = insightsInput.value.trim();
            }

            customer.updatedAt = new Date().toLocaleString('ja-JP');

            displayCustomers();
            closeEditModal();
            alert('✅ 情報を更新しました');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingCustomerId = null;
        }

        // 初期表示
        displayCustomers();
    </script>
</body>
</html>
