<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顧客管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 10px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(218, 165, 32, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(192, 192, 192, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            z-index: -1;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #daa520;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.5),
                         0 0 40px rgba(218, 165, 32, 0.3);
            font-weight: 300;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #daa520 0%, #ffd700 50%, #daa520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #c0c0c0;
            font-size: 0.75em;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        /* タブナビゲーション */
        .tab-navigation {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: rgba(26, 26, 46, 0.5);
            padding: 5px;
            border-radius: 15px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-button {
            flex: 1;
            padding: 12px 10px;
            background: rgba(40, 40, 60, 0.6);
            color: #c0c0c0;
            border: 2px solid rgba(218, 165, 32, 0.2);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
            text-align: center;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border-color: #daa520;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.4);
        }

        .tab-button:hover:not(.active) {
            background: rgba(218, 165, 32, 0.2);
            border-color: rgba(218, 165, 32, 0.4);
        }

        /* タブコンテンツ */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .main-content {
            display: block;
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(20, 20, 35, 0.95) 100%);
            border-radius: 15px;
            padding: 15px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 1px rgba(218, 165, 32, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(218, 165, 32, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card h2 {
            color: #daa520;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid rgba(218, 165, 32, 0.3);
            padding-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .api-setup {
            background: rgba(218, 165, 32, 0.1);
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-setup label {
            display: block;
            color: #daa520;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .api-setup input {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
        }

        .api-setup small {
            display: block;
            color: #c0c0c0;
            margin-top: 5px;
            font-size: 0.85em;
        }

        .api-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .api-status.connected {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .api-status.disconnected {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-with-voice {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-with-voice textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .input-with-voice textarea:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.2);
        }

        .input-with-voice textarea::placeholder {
            color: rgba(192, 192, 192, 0.5);
        }

        .voice-btn {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            width: 60px;
            height: 60px;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
            position: relative;
        }

        .voice-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
        }

        .voice-btn.listening {
            background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
            animation: pulse 1s infinite;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .btn {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            border: none;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
            letter-spacing: 0.05em;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .help-text {
            font-size: 0.9em;
            color: #c0c0c0;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #daa520;
        }

        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75em;
            margin-left: 8px;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .customer-card {
            background: linear-gradient(135deg, rgba(40, 40, 60, 0.6) 0%, rgba(30, 30, 50, 0.6) 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #daa520;
            transition: all 0.4s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .customer-card.ai-analyzed {
            border-left-color: #667eea;
        }

        .customer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(218, 165, 32, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .customer-card:hover {
            transform: translateX(8px);
            box-shadow: 0 10px 40px rgba(218, 165, 32, 0.2);
            border-left-color: #ffd700;
        }

        .customer-card:hover::before {
            opacity: 1;
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .customer-name {
            font-size: 1.5em;
            font-weight: 300;
            color: #daa520;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .customer-id {
            font-size: 0.85em;
            color: #c0c0c0;
            margin-left: 10px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }

        .info-item {
            font-size: 0.95em;
            color: #e0e0e0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(218, 165, 32, 0.2);
            transition: all 0.3s;
        }

        .info-item:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(218, 165, 32, 0.4);
        }

        .info-label {
            font-weight: bold;
            color: #daa520;
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            letter-spacing: 0.05em;
        }

        .info-value {
            color: #f0f0f0;
        }

        .ai-insights {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .ai-insights-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-insights-content {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 0.9em;
        }

        .delete-btn {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
            font-weight: bold;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #a93226 0%, #c0392b 100%);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.5);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            color: #c0c0c0;
            padding: 50px;
            font-size: 1.1em;
            letter-spacing: 0.05em;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.2);
        }

        .search-box input::placeholder {
            color: rgba(192, 192, 192, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98) 0%, rgba(20, 20, 35, 0.98) 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(218, 165, 32, 0.3);
        }

        .modal-content h3 {
            color: #daa520;
            text-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }

        .modal-content p {
            color: #c0c0c0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            letter-spacing: 0.05em;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #daa520 0%, #b8860b 100%);
            color: #000;
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.3);
        }

        .modal-btn.primary:hover {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            box-shadow: 0 8px 30px rgba(218, 165, 32, 0.5);
            transform: translateY(-2px);
        }

        .modal-btn.secondary {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .modal-btn.secondary:hover {
            background: linear-gradient(135deg, #a93226 0%, #c0392b 100%);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.5);
            transform: translateY(-2px);
        }

        .modal-btn.cancel {
            background: linear-gradient(135deg, #4a4a4a 0%, #2c2c2c 100%);
            color: #c0c0c0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-btn.cancel:hover {
            background: linear-gradient(135deg, #5a5a5a 0%, #3c3c3c 100%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .edit-btn {
            background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.3);
            font-weight: bold;
            margin-right: 10px;
        }

        .edit-btn:hover {
            background: linear-gradient(135deg, #2471a3 0%, #2980b9 100%);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.5);
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        #editModal .modal-content {
            max-width: 800px;
        }

        .edit-form {
            margin-top: 20px;
        }

        .edit-form-group {
            margin-bottom: 15px;
        }

        .edit-form-group label {
            display: block;
            color: #daa520;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .edit-form-group input,
        .edit-form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }

        .edit-form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .edit-form-group input:focus,
        .edit-form-group textarea:focus {
            outline: none;
            border-color: #daa520;
            background: rgba(0, 0, 0, 0.5);
        }

        /* スマートフォン対応の追加スタイル */
        .customer-card {
            padding: 15px;
            margin-bottom: 15px;
        }

        .customer-name {
            font-size: 1.2em;
        }

        .customer-info {
            grid-template-columns: 1fr;
        }

        .help-text {
            font-size: 0.85em;
            padding: 10px;
        }

        .input-with-voice textarea {
            min-height: 100px;
            font-size: 16px;
        }

        .voice-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }

        .btn {
            font-size: 14px;
            padding: 12px 20px;
        }

        .ai-badge {
            font-size: 0.7em;
            padding: 2px 6px;
        }

        @media (max-width: 1024px) {
            .main-content {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 顧客管理システム</h1>
            <p>AI搭載・自動解析対応 <span class="ai-badge">🤖 AI Powered</span></p>
        </div>

        <!-- タブナビゲーション -->
        <div class="tab-navigation">
            <button class="tab-button active" onclick="switchTab('api-key')">🔑 APIキー</button>
            <button class="tab-button" onclick="switchTab('input')">📝 情報入力</button>
            <button class="tab-button" onclick="switchTab('customer-list')">📋 顧客管理</button>
        </div>

        <div class="main-content">
            <!-- タブ1: APIキー設定 -->
            <div id="tab-api-key" class="tab-content active">
                <div class="card">
                    <h2>🔑 OpenAI APIキー設定</h2>
                    <div class="api-setup">
                        <label>🔑 OpenAI APIキー</label>
                        <input type="password" id="apiKey" placeholder="sk-...">
                        <small>APIキーはブラウザに保存され、サーバーには送信されません</small>
                        <div class="api-status disconnected" id="apiStatus">未接続</div>
                    </div>
                </div>
            </div>

            <!-- タブ2: 顧客情報入力 -->
            <div id="tab-input" class="tab-content">
                <div class="card">
                    <h2>📝 顧客情報入力</h2>
                    <div class="help-text">
                        💡 自由に情報を入力してください。AIが自動で詳細に解析します。<br>
                        例:「田中花子さん、28歳、看護師、シャンパンが好き、旅行が趣味」
                    </div>
                    <div class="input-section">
                        <div class="input-with-voice">
                            <textarea id="inputText" placeholder="お客様の情報を入力してください...&#10;&#10;AIが自動で項目を認識し、接客に役立つインサイトを提供します。&#10;🎤ボタンで音声入力も可能です。"></textarea>
                            <button class="voice-btn" onclick="startVoice()">🎤</button>
                        </div>
                        <button class="btn" id="submitBtn" onclick="processInput()">🤖 AIで解析して登録</button>
                    </div>
                </div>
            </div>

            <!-- タブ3: 顧客管理 -->
            <div id="tab-customer-list" class="tab-content">
                <div class="card">
                    <h2>📋 顧客リスト</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 お客様を検索..." oninput="searchCustomers()">
                    </div>
                    <div id="customerList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="duplicateModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #667eea; margin-bottom: 15px;">⚠️ 同名のお客様が存在します</h3>
            <p style="margin-bottom: 20px;">どのように処理しますか?</p>
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="handleDuplicate('new')">別人として新規登録</button>
                <button class="modal-btn secondary" onclick="handleDuplicate('update')">既存情報を更新</button>
                <button class="modal-btn cancel" onclick="closeDuplicateModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #daa520; margin-bottom: 15px;">✏️ 顧客情報の編集</h3>
            <div class="edit-form" id="editForm"></div>
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="saveEdit()">保存</button>
                <button class="modal-btn cancel" onclick="closeEditModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
